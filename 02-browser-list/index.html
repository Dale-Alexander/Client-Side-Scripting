<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Product list</title><link rel="stylesheet" href="../../shared/style.css"></head>
<body><main>
<h1>Product list</h1>
<label for="search">Filter by product name</label><input id="search" type="search" placeholder="Try keyboard">
<p id="summary"></p>
<table><thead><tr><th scope="col">Name</th><th scope="col">Price</th><th scope="col">Stock</th><th scope="col">Action</th></tr></thead><tbody id="rows"></tbody></table>
<p id="empty" hidden>No matching products.</p>
<h2>Add a product</h2>
<form id="add-form" novalidate>
<label for="name">Product name</label><input id="name" required>
<label for="price">Price in EUR</label><input id="price" type="number" min="0" step="0.01" required>
<div><button type="submit">Add product</button></div>
</form>
<p id="status" class="status" role="status" aria-live="polite"></p>
<p>New products start with one item in stock. Refresh resets this exercise.</p>
</main><script type="module" src="app.js"></script></body></html>
